<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Test Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <header>
      <div class="status-dot" id="statusDot"></div>
      <h1>Server is <span class="highlight">alive</span></h1>
      <p class="sub">HTML · CSS · JavaScript — all loading correctly</p>
    </header>

    <div class="cards">
      <div class="card" id="card-html">
        <div class="card-icon">📄</div>
        <div class="card-label">HTML</div>
        <div class="card-status">✓ served</div>
      </div>
      <div class="card" id="card-css">
        <div class="card-icon">🎨</div>
        <div class="card-label">CSS</div>
        <div class="card-status" id="cssStatus">checking…</div>
      </div>
      <div class="card" id="card-js">
        <div class="card-icon">⚡</div>
        <div class="card-label">JavaScript</div>
        <div class="card-status" id="jsStatus">checking…</div>
      </div>
    </div>

    <div class="fun-zone">
      <p class="fun-label">click anywhere below to ripple</p>
      <canvas id="canvas"></canvas>
    </div>

    <footer>
      <span id="clock"></span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
